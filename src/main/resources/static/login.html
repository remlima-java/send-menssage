<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <title>Login - Chat Kafka</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #f3f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            max-width: 450px;
            width: 100%;
            padding: 20px;
        }

        .card {
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: none;
        }

        .card-title {
            color: #3a3a3a;
            font-weight: 600;
        }

        .form-control {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }

        .btn-primary {
            padding: 12px;
            border-radius: 8px;
            font-weight: 500;
            background-color: #0d6efd;
            border: none;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background-color: #0b5ed7;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-emoji {
            font-size: 64px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="card shadow">
        <div class="card-body p-4">
            <div class="logo-section">
                <div class="logo-emoji">💬</div>
                <h2 class="card-title mb-2">Bem-vindo ao Chat em tempo real</h2>
                <p class="text-muted">Faça login para continuar</p>
            </div>

            <div id="alertBox" class="alert alert-danger d-none mb-4" role="alert"></div>

            <form id="loginForm">
                <div class="mb-4">
                    <label for="username" class="form-label">Nome de usuário</label>
                    <input type="text" class="form-control" id="username" placeholder="Digite seu usuário" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" placeholder="Digite sua senha" required>
                </div>
                <div class="d-grid gap-2 mb-4">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <span id="loginBtnText">Entrar</span>
                        <span id="loginSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status" aria-hidden="true"></span>
                    </button>
                </div>
            </form>

            <div class="text-center">
                <p class="mb-0">Não tem uma conta? <a href="register.html" class="text-decoration-none fw-bold">Registre-se</a></p>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Verificar se o usuário já está autenticado
        const token = localStorage.getItem('token');
        if (token) {
            window.location.href = '/';
            return;
        }

        const loginForm = document.getElementById('loginForm');
        const alertBox = document.getElementById('alertBox');
        const loginBtnText = document.getElementById('loginBtnText');
        const loginSpinner = document.getElementById('loginSpinner');

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Mostrar loading
            loginBtnText.textContent = 'Entrando...';
            loginSpinner.classList.remove('d-none');
            alertBox.classList.add('d-none');

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Salvar token e informações do usuário
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);

                    // Redirecionar para a página principal
                    window.location.href = '/';
                } else {
                    // Mostrar erro
                    alertBox.textContent = data.message || 'Nome de usuário ou senha incorretos';
                    alertBox.classList.remove('d-none');

                    // Resetar botão
                    loginBtnText.textContent = 'Entrar';
                    loginSpinner.classList.add('d-none');
                }
            } catch (error) {
                console.error('Erro ao fazer login:', error);
                alertBox.textContent = 'Erro ao conectar com o servidor. Tente novamente mais tarde.';
                alertBox.classList.remove('d-none');

                // Resetar botão
                loginBtnText.textContent = 'Entrar';
                loginSpinner.classList.add('d-none');
            }
        });
    });
</script>

</body>
</html>
