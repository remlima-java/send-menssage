<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <title>Registrar - Chat Kafka</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #f3f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-container {
            max-width: 450px;
            width: 100%;
            padding: 20px;
        }

        .card {
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: none;
        }

        .card-title {
            color: #3a3a3a;
            font-weight: 600;
        }

        .form-control {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }

        .btn-primary {
            padding: 12px;
            border-radius: 8px;
            font-weight: 500;
            background-color: #0d6efd;
            border: none;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background-color: #0b5ed7;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-emoji {
            font-size: 64px;
            margin-bottom: 15px;
        }

        .password-strength {
            height: 5px;
            border-radius: 5px;
            margin-top: 8px;
            transition: all 0.3s;
        }
    </style>
</head>
<body>

<div class="register-container">
    <div class="card shadow">
        <div class="card-body p-4">
            <div class="logo-section">
                <div class="logo-emoji">📝</div>
                <h2 class="card-title mb-2">Criar Nova Conta</h2>
                <p class="text-muted">Registre-se para começar a conversar</p>
            </div>

            <div id="alertBox" class="alert alert-danger d-none mb-4" role="alert"></div>
            <div id="successBox" class="alert alert-success d-none mb-4" role="alert"></div>

            <form id="registerForm">
                <div class="mb-4">
                    <label for="username" class="form-label">Nome de usuário</label>
                    <input type="text" class="form-control" id="username" placeholder="Escolha um nome de usuário" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" placeholder="Crie uma senha segura" required>
                    <div id="passwordStrength" class="password-strength w-100 bg-light"></div>
                </div>
                <div class="mb-4">
                    <label for="confirmPassword" class="form-label">Confirmar senha</label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Digite a senha novamente" required>
                </div>
                <div class="d-grid gap-2 mb-4">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <span id="registerBtnText">Registrar</span>
                        <span id="registerSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status" aria-hidden="true"></span>
                    </button>
                </div>
            </form>

            <div class="text-center">
                <p class="mb-0">Já tem uma conta? <a href="login.html" class="text-decoration-none fw-bold">Faça login</a></p>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Verificar se o usuário já está autenticado
        const token = localStorage.getItem('token');
        if (token) {
            window.location.href = '/';
            return;
        }

        const registerForm = document.getElementById('registerForm');
        const alertBox = document.getElementById('alertBox');
        const successBox = document.getElementById('successBox');
        const registerBtnText = document.getElementById('registerBtnText');
        const registerSpinner = document.getElementById('registerSpinner');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const passwordStrength = document.getElementById('passwordStrength');

        // Função para verificar força da senha
        passwordInput.addEventListener('input', function() {
            const password = this.value;
            let strength = 0;

            // Comprimento mínimo
            if (password.length >= 6) strength += 25;

            // Letras maiúsculas e minúsculas
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength += 25;

            // Números
            if (password.match(/\d/)) strength += 25;

            // Caracteres especiais
            if (password.match(/[^a-zA-Z\d]/)) strength += 25;

            // Atualizar barra de força
            passwordStrength.style.width = strength + '%';

            // Mudar cor com base na força
            if (strength <= 25) {
                passwordStrength.className = 'password-strength w-100 bg-danger';
            } else if (strength <= 50) {
                passwordStrength.className = 'password-strength w-100 bg-warning';
            } else if (strength <= 75) {
                passwordStrength.className = 'password-strength w-100 bg-info';
            } else {
                passwordStrength.className = 'password-strength w-100 bg-success';
            }
        });

        // Validação do formulário
        registerForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Resetar alertas
            alertBox.classList.add('d-none');
            successBox.classList.add('d-none');

            const username = document.getElementById('username').value;
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            // Validações básicas
            if (username.length < 3) {
                alertBox.textContent = 'Nome de usuário deve ter pelo menos 3 caracteres';
                alertBox.classList.remove('d-none');
                return;
            }

            if (password.length < 6) {
                alertBox.textContent = 'Senha deve ter pelo menos 6 caracteres';
                alertBox.classList.remove('d-none');
                return;
            }

            if (password !== confirmPassword) {
                alertBox.textContent = 'As senhas não coincidem';
                alertBox.classList.remove('d-none');
                return;
            }

            // Mostrar loading
            registerBtnText.textContent = 'Registrando...';
            registerSpinner.classList.remove('d-none');

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Salvar token e informações do usuário
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);

                    // Mostrar mensagem de sucesso
                    successBox.textContent = 'Registro realizado com sucesso! Redirecionando...';
                    successBox.classList.remove('d-none');

                    // Redirecionar após 2 segundos
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 2000);
                } else {
                    // Mostrar erro
                    alertBox.textContent = data.message || 'Erro ao registrar usuário';
                    alertBox.classList.remove('d-none');

                    // Resetar botão
                    registerBtnText.textContent = 'Registrar';
                    registerSpinner.classList.add('d-none');
                }
            } catch (error) {
                console.error('Erro ao registrar:', error);
                alertBox.textContent = 'Erro ao conectar com o servidor. Tente novamente mais tarde.';
                alertBox.classList.remove('d-none');

                // Resetar botão
                registerBtnText.textContent = 'Registrar';
                registerSpinner.classList.add('d-none');
            }
        });
    });
</script>

</body>
</html>
