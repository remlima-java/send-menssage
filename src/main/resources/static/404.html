<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <title>Página Não Encontrada - Chat Kafka</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #f3f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-container {
            max-width: 500px;
            text-align: center;
            padding: 20px;
        }

        .error-emoji {
            font-size: 100px;
            margin-bottom: 20px;
        }

        .btn {
            border-radius: 8px;
            padding: 10px 20px;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

<div class="error-container">
    <div class="error-emoji">🤔</div>
    <h1 class="mb-4">Página Não Encontrada</h1>
    <p class="text-muted mb-4">A página que você está procurando não existe ou foi removida.</p>
    <div class="d-grid gap-2 d-md-block">
        <a href="/" class="btn btn-primary me-md-2">
            <i class="bi bi-house-door"></i>
            Voltar para a Página Inicial
        </a>
        <a href="javascript:history.back()" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i>
            Voltar
        </a>
    </div>
</div>

</body>
</html>
