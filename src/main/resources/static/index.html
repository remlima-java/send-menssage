<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <title>Chat em Tempo Real - Totalmente offline</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- Navbar -->
<div class="container py-4">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-chat-dots-fill text-primary me-2"></i>
                4sete
            </a>
            <div class="d-flex align-items-center">
                <div class="user-info me-3">
                    <div class="user-avatar" id="userAvatar"></div>
                    <span id="userDisplay">Carregando...</span>
                </div>
                <button id="logoutBtn" class="btn btn-outline-danger">
                    <i class="bi bi-box-arrow-right me-1"></i>
                    Sair
                </button>
            </div>
        </div>
    </nav>

    <h2 class="mb-4 text-center text-primary">🟢 Chat in real time </h2>

    <!-- Formulário de envio -->
    <form id="messageForm" class="card shadow-sm p-3 mb-4">
        <div class="row g-3">
            <div class="col-md-6">
                <label for="from"></label><input type="text" class="form-control" id="from" placeholder="De" required />
            </div>
            <div class="col-md-6">
                <label for="to"></label><input type="text" class="form-control" id="to" placeholder="Para" required />
            </div>
            <div class="col-12">
                <label for="content"></label><textarea class="form-control" id="content" placeholder="Mensagem..." rows="2" required></textarea>
            </div>
            <div class="col-12 text-end">
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-send-fill me-1"></i>
                    Enviar
                </button>
            </div>
        </div>
    </form>

    <!-- Lista de mensagens -->
    <div class="chat-list list-group bg-white rounded shadow-sm p-3" id="messageList">
        <div class="loading" id="loadingIndicator">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Carregando...</span>
            </div>
            <p>Carregando mensagens...</p>
        </div>
    </div>
</div>

<!-- Toast para feedback -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div id="liveToast" class="toast bg-dark text-white" role="alert">
        <div class="toast-header bg-dark text-white">
            <strong class="me-auto">Nova mensagem</strong>
            <small>agora</small>
        </div>
        <div class="toast-body" id="toastBody">Mensagem recebida!</div>
    </div>
</div>

<!-- Scripts -->
<script src="js/script.js">

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
