<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <title>Chat Kafka em Tempo Real</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #f3f5f9;
        }
        .chat-bubble strong {
            color: #0056b3;
        }
        .chat-list {
            height: 60vh;
            overflow-y: auto;
            padding-right: 10px;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #6c757d;
        }
        .history-message {
            border-left: 3px solid #28a745;
        }
        .realtime-message {
            border-left: 3px solid #007bff;
        }
    </style>
</head>
<body>

<div class="container py-4">
    <h2 class="mb-4 text-center text-primary">🟢 Chat em Tempo Real com Kafka</h2>

    <!-- Formulário de envio -->
    <form id="messageForm" class="card shadow-sm p-3 mb-4">
        <div class="row g-3">
            <div class="col-md-4">
                <label for="username"></label><input type="text" class="form-control" id="username" placeholder="Assunto" required />
            </div>
            <div class="col-md-4">
                <label for="from"></label><input type="text" class="form-control" id="from" placeholder="De" required />
            </div>
            <div class="col-md-4">
                <label for="to"></label><input type="text" class="form-control" id="to" placeholder="Para" required />
            </div>
            <div class="col-12">
                <label for="content"></label><textarea class="form-control" id="content" placeholder="Mensagem..." rows="2" required></textarea>
            </div>
            <div class="col-12 text-end">
                <button type="submit" class="btn btn-success">Enviar 📨</button>
            </div>
        </div>
    </form>

    <!-- Lista de mensagens -->
    <div class="chat-list list-group bg-white rounded shadow-sm p-3" id="messageList">
        <div class="loading" id="loadingIndicator">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Carregando...</span>
            </div>
            <p>Carregando mensagens...</p>
        </div>
    </div>
</div>

<!-- Toast para feedback -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div id="liveToast" class="toast bg-dark text-white" role="alert">
        <div class="toast-header bg-dark text-white">
            <strong class="me-auto">Nova mensagem</strong>
            <small>agora</small>
        </div>
        <div class="toast-body" id="toastBody">Mensagem recebida!</div>
    </div>
</div>

<!-- Scripts -->
<script>
    const apiUrl = "http://localhost:8080/user";
    const messagesUrl = "http://localhost:8080/messages";
    const messageList = document.getElementById("messageList");
    const loadingIndicator = document.getElementById("loadingIndicator");

    // ID do elemento da mensagem "Seja o primeiro a enviar"
    let emptyMessageId = null;

    // Função para criar um elemento de mensagem
    function createMessageElement(message, isHistory = false) {
        const bubble = document.createElement("div");
        bubble.className = `chat-bubble list-group-item mb-2 ${isHistory ? 'history-message' : 'realtime-message'}`;

        // Fix para o Bug #2: Usar o título correto da mensagem
        // Verificamos todos os possíveis locais do título para evitar "Sem assunto"
        let subject = 'Assunto não encontrado';

        if (message.user && message.user.username) {
            subject = message.user.username;
        } else if (message.username) {
            subject = message.username;
        } else if (message.subject) {
            subject = message.subject;
        }

        bubble.innerHTML = `
            <strong>${subject}</strong><br>
            🗨️ De: ${message.emitter || 'Desconhecido'} → Para: ${message.recipient || 'Desconhecido'}<br>
            "${message.content || ''}"<br>
            <small class="text-muted">${message.timestamp ? new Date(message.timestamp).toLocaleString() : 'Sem data'}</small>
        `;
        return bubble;
    }

    // Carregar histórico de mensagens ao inicializar
    async function loadMessageHistory() {
        try {
            const response = await fetch(messagesUrl);

            if (!response.ok) {
                throw new Error(`Erro ao carregar mensagens: ${response.status}`);
            }

            const messages = await response.json();

            // Remover indicador de carregamento
            if (loadingIndicator) {
                loadingIndicator.remove();
            }

            // Se não houver mensagens, mostrar mensagem
            if (!messages || messages.length === 0) {
                const emptyMessage = document.createElement("div");
                emptyMessage.id = "empty-message-notice"; // ID para identificar facilmente
                emptyMessageId = "empty-message-notice"; // Armazenar o ID para remoção posterior
                emptyMessage.className = "text-center text-muted my-4";
                emptyMessage.textContent = "Nenhuma mensagem encontrada. Seja o primeiro a enviar!";
                messageList.appendChild(emptyMessage);
                return;
            }

            console.log(`Carregadas ${messages.length} mensagens`);

            // Fix para o Bug #3: Garantir que as mensagens mais recentes estejam no topo
            // Ordena as mensagens por timestamp em ordem decrescente (mais recentes primeiro)
            messages.sort((a, b) => {
                const dateA = a.timestamp ? new Date(a.timestamp).getTime() : 0;
                const dateB = b.timestamp ? new Date(b.timestamp).getTime() : 0;
                return dateB - dateA; // Ordem decrescente
            });

            // Adicionar mensagens do histórico
            messages.forEach(message => {
                // Inserir no início da lista para manter as mais recentes no topo
                messageList.insertBefore(createMessageElement(message, true), messageList.firstChild);
            });

            // Rolar para o topo para ver as mensagens mais recentes
            messageList.scrollTop = 0;

        } catch (error) {
            console.error("Erro ao carregar mensagens:", error);

            // Remover indicador de carregamento e mostrar erro
            if (loadingIndicator) {
                loadingIndicator.remove();
            }

            const errorMessage = document.createElement("div");
            errorMessage.className = "alert alert-danger";
            errorMessage.textContent = `Erro ao carregar mensagens: ${error.message}`;
            messageList.appendChild(errorMessage);
        }
    }

    // Carregar histórico quando a página for carregada
    document.addEventListener('DOMContentLoaded', loadMessageHistory);

    // Envio de novas mensagens
    document.getElementById("messageForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const msg = {
            username: document.getElementById("username").value, // Agora é o assunto
            messages: [{
                emitter: document.getElementById("from").value,
                recipient: document.getElementById("to").value,
                content: document.getElementById("content").value
            }]
        };

        try {
            const res = await fetch(apiUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(msg)
            });

            if (res.ok) {
                console.log("Mensagem enviada com sucesso");
                e.target.reset();

                // Fix para o Bug #1: Remover a mensagem "Seja o primeiro a enviar" quando uma nova mensagem é enviada
                if (emptyMessageId) {
                    const emptyElement = document.getElementById(emptyMessageId);
                    if (emptyElement) {
                        emptyElement.remove();
                    }
                    emptyMessageId = null; // Limpar o ID após a remoção
                }
            } else {
                console.error("Erro ao enviar mensagem:", await res.text());
                alert("Erro ao enviar mensagem");
            }
        } catch (err) {
            console.error("Erro ao enviar:", err);
            alert(`Erro ao enviar: ${err.message}`);
        }
    });

    // SSE: escuta atualizações da fila Kafka
    const eventSource = new EventSource("http://localhost:8080/stream");

    eventSource.onopen = () => {
        console.log("Conexão SSE estabelecida");
    };

    eventSource.onerror = (error) => {
        console.error("Erro na conexão SSE:", error);
    };

    eventSource.addEventListener("message", (event) => {
        console.log("Evento SSE recebido:", event.data);

        try {
            const user = JSON.parse(event.data);

            if (!user || !user.messages || !Array.isArray(user.messages)) {
                console.warn("Dados inválidos recebidos:", user);
                return;
            }

            // Fix para o Bug #1: Remover a mensagem "Seja o primeiro a enviar" quando uma nova mensagem é recebida
            if (emptyMessageId) {
                const emptyElement = document.getElementById(emptyMessageId);
                if (emptyElement) {
                    emptyElement.remove();
                }
                emptyMessageId = null; // Limpar o ID após a remoção
            }

            user.messages.forEach(msg => {
                if (!msg) {
                    console.warn("Mensagem inválida encontrada");
                    return;
                }

                // Adicionamos a referência ao usuário na mensagem para mostrar o assunto
                msg.user = { username: user.username };

                // Adicionar a nova mensagem no início da lista (topo)
                const messageElement = createMessageElement(msg, false);
                messageList.insertBefore(messageElement, messageList.firstChild);

                // Rolar para o topo para ver a mensagem mais recente
                messageList.scrollTop = 0;

                // Toast visual
                document.getElementById("toastBody").textContent =
                    `${user.username || 'Sem assunto'}: ${msg.content || ''}`;

                const toastEl = document.getElementById("liveToast");
                const toast = new bootstrap.Toast(toastEl);
                toast.show();
            });
        } catch (error) {
            console.error("Erro ao processar mensagem SSE:", error);
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
