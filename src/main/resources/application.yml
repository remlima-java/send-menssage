spring:
  profiles:
    active: local
  application:
    name: chat in real time

  datasource:
    url: jdbc:postgresql://localhost:5432/messages
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database: postgresql
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    br.dev.rtisystem: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO

# Configuração do Actuator com Prometheus para integração com Grafana
management:
  observations:
    enable:
      spring.security: false
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    disable-swagger-default-url: true
  show-actuator: true
