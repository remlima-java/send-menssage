<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mensagens</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-secondary text-white">
  <div class="container py-4">
    <h2 class="mb-4 text-primary">📨 Enviar Mensagem</h2>

    <form id="messageForm" class="mb-4">
      <div class="mb-3">
        <label for="username" class="form-label">Username:</label>
        <input type="text" class="form-control" id="username" required />
      </div>
      <div class="mb-3">
        <label for="from" class="form-label">De:</label>
        <input type="text" class="form-control" id="from" required />
      </div>
      <div class="mb-3">
        <label for="to" class="form-label">Para:</label>
        <input type="text" class="form-control" id="to" required />
      </div>
      <div class="mb-3">
        <label for="content" class="form-label">Mensagem:</label>
        <textarea class="form-control" id="content" rows="3" required></textarea>
      </div>
      <button type="submit" class="btn btn-success">Enviar</button>
    </form>

    <h4 class="text-secondary">Mensagens Enviadas</h4>
    <ul id="messageList" class="list-group"></ul>
  </div>

  <script>
    const eventSource = new EventSource("http://localhost:8080/message/stream");

    eventSource.addEventListener("message", function(event) {
      const list = document.getElementById("messageList");
      const item = document.createElement("li");
      item.className = "list-group-item";
      item.textContent = `📨 ${event.data}`;
      list.appendChild(item);
    });

    eventSource.onerror = function(err) {
      console.error("Erro no SSE:", err);
      eventSource.close();
    };
  </script>


</body>
</html>
