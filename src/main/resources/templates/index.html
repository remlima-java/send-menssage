<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Chat Kafka em Tempo Real</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f3f5f9;
    }
    .chat-bubble strong {
      color: #0056b3;
    }
    .chat-list {
      height: 60vh;
      overflow-y: auto;
      padding-right: 10px;
    }
  </style>
</head>
<body>

<div class="container py-4">
  <h2 class="mb-4 text-center text-primary">🟢 Chat em Tempo Real com Kafka</h2>

  <!-- Formulário de envio -->
  <form id="messageForm" class="card shadow-sm p-3 mb-4">
    <div class="row g-3">
      <div class="col-md-4">
        <label for="username"></label><input type="text" class="form-control" id="username" placeholder="Username" required />
      </div>
      <div class="col-md-4">
        <label for="from"></label><input type="text" class="form-control" id="from" placeholder="De" required />
      </div>
      <div class="col-md-4">
        <label for="to"></label><input type="text" class="form-control" id="to" placeholder="Para" required />
      </div>
      <div class="col-12">
        <label for="content"></label><textarea class="form-control" id="content" placeholder="Mensagem..." rows="2" required></textarea>
      </div>
      <div class="col-12 text-end">
        <button type="submit" class="btn btn-success">Enviar 📨</button>
      </div>
    </div>
  </form>

  <!-- Lista de mensagens -->
  <div class="chat-list list-group bg-white rounded shadow-sm p-3" id="messageList">
    <!-- Mensagens aparecerão aqui -->
  </div>
</div>

<!-- Toast para feedback -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
  <div id="liveToast" class="toast bg-dark text-white" role="alert">
    <div class="toast-header bg-dark text-white">
      <strong class="me-auto">Nova mensagem</strong>
      <small>agora</small>
    </div>
    <div class="toast-body" id="toastBody">Mensagem recebida!</div>
  </div>
</div>

<!-- Scripts -->
<script>
  const apiUrl = "http://localhost:8080/user";

  document.getElementById("messageForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const msg = {
      username: document.getElementById("username").value,
      messages: [{
        from: document.getElementById("from").value,
        to: document.getElementById("to").value,
        content: document.getElementById("content").value
      }]
    };

    try {
      const res = await fetch(apiUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(msg)
      });

      if (res.ok) {
        e.target.reset();
      } else {
        alert("Erro ao enviar mensagem");
      }
    } catch (err) {
      console.error("Erro ao enviar:", err);
    }
  });

  // SSE: escuta atualizações da fila Kafka
  const eventSource = new EventSource("http://localhost:8080/stream");

  eventSource.addEventListener("message", (event) => {

    try {
      const user = JSON.parse(event.data);
      const list = document.getElementById("messageList");
      console.log(list);

      user.messages.forEach(msg => {
        const bubble = document.createElement("div");
        bubble.className = "chat-bubble";
        bubble.innerHTML = `
            <strong>${user.username}</strong><br>
            🗨️ De: ${msg.emitter} → Para: ${msg.recipient}<br>
            "${msg.content}"<br>
            <small class="text-muted">${new Date(msg.timestamp).toLocaleString()}</small>
          `;
        list.appendChild(bubble);
        list.scrollTop = list.scrollHeight;

        // Toast visual
        document.getElementById("toastBody").textContent = `${user.username} → ${msg.to}: ${msg.content}`;
        new bootstrap.Toast(document.getElementById("liveToast")).show();
      });
    } catch (error) {
      console.warn("Erro ao processar SSE:", error);
    }
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
